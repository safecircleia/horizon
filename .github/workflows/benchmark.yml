name: Accuracy Benchmark

on:
  push:
    paths:
      - 'training/**'
      - 'evaluation/**'
      - 'data/generation/**'
  pull_request:
    paths:
      - 'training/**'
      - 'evaluation/**'
      - 'data/generation/**'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Model checkpoint path'
        required: false
        default: 'models/horizon-edge-2b'

jobs:
  benchmark:
    name: Accuracy targets & regression check
    runs-on: ubuntu-latest
    # ponytail: skip GPU runner requirement in CI; add self-hosted when runner is registered
    env:
      CHECKPOINT: ${{ inputs.checkpoint || 'models/horizon-edge-2b' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[eval]" --quiet

      - name: Restore baseline
        uses: actions/cache@v4
        with:
          path: evaluation/reports/baseline.json
          key: benchmark-baseline-${{ github.base_ref || github.ref_name }}

      - name: Create benchmark split
        run: python -m data.scripts.create_benchmark_split
        env:
          PYTHONPATH: .

      - name: Run benchmark
        id: benchmark
        run: python -m evaluation.benchmark --checkpoint "$CHECKPOINT" --batch-size 8
        env:
          PYTHONPATH: .

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: evaluation/reports/benchmark/results.json

      - name: Save new baseline on main
        if: github.ref == 'refs/heads/main' && steps.benchmark.outcome == 'success'
        run: python -m evaluation.benchmark --checkpoint "$CHECKPOINT" --batch-size 8 --save-baseline
        env:
          PYTHONPATH: .
