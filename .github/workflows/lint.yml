name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Pytest
        run: pytest --quiet
        env:
          PYTHONPATH: .
