name: Mobile Model Benchmark

on:
  push:
    paths:
      - 'training/**'
      - 'evaluation/**'
      - 'inference/**'
      - 'data/generation/**'
  pull_request:
    paths:
      - 'training/**'
      - 'evaluation/**'
      - 'inference/**'
      - 'data/generation/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'Path to .litertlm model file'
        required: false
        default: 'models/mobile-standard/horizon-mobile-int8_q8_ekv1280.litertlm'
      max_samples:
        description: 'Maximum examples to evaluate (empty = all)'
        required: false
        default: ''

jobs:
  benchmark-mobile:
    name: Mobile accuracy + performance targets (issue #8)
    runs-on: ubuntu-latest
    env:
      MODEL_PATH: ${{ inputs.model || 'models/mobile-standard/horizon-mobile-int8_q8_ekv1280.litertlm' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[eval]" --quiet

      - name: Install litert-lm
        run: pip install litert-lm --quiet

      - name: Restore mobile baseline
        uses: actions/cache@v4
        with:
          path: evaluation/reports/benchmark_mobile/baseline.json
          key: benchmark-mobile-baseline-${{ github.base_ref || github.ref_name }}

      - name: Create benchmark split
        run: python -m data.scripts.create_benchmark_split
        env:
          PYTHONPATH: .

      - name: Run mobile benchmark
        id: benchmark
        run: |
          CMD="python -m evaluation.benchmark_mobile --model $MODEL_PATH --test-set data/evaluation/benchmark.jsonl"
          if [ -n "${{ inputs.max_samples }}" ]; then
            CMD="$CMD --max-samples ${{ inputs.max_samples }}"
          fi
          eval "$CMD"
        env:
          PYTHONPATH: .

      - name: Upload mobile benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-mobile-report-${{ github.sha }}
          path: evaluation/reports/benchmark_mobile/results.json

      - name: Save new mobile baseline on main
        if: github.ref == 'refs/heads/main' && steps.benchmark.outcome == 'success'
        run: |
          python -m evaluation.benchmark_mobile \
            --model "$MODEL_PATH" \
            --test-set data/evaluation/benchmark.jsonl \
            --save-baseline
        env:
          PYTHONPATH: .

  profile-mobile:
    name: Mobile performance profiling
    runs-on: ubuntu-latest
    env:
      MODEL_PATH: ${{ inputs.model || 'models/mobile-standard/horizon-mobile-int8_q8_ekv1280.litertlm' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psutil litert-lm --quiet

      - name: Run profiling with target checks
        run: |
          python -m evaluation.profile_mobile \
            --model "$MODEL_PATH" \
            --runs 5 \
            --check-targets
        env:
          PYTHONPATH: .

      - name: Upload profile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-mobile-report-${{ github.sha }}
          path: evaluation/reports/profile.json
