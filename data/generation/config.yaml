# Data Generation Configuration

# Target dataset size — 500K total (60% en / 40% es via mixed mode)
dataset_targets:
  grooming: 80000
  bullying: 70000
  sexual_content: 70000
  isolation: 50000
  personal_info: 50000
  platform_migration: 30000
  threats: 50000
  benign: 100000

# Severity distribution (for risk categories)
severity_distribution:
  low: 0.25
  medium: 0.35
  high: 0.25
  critical: 0.15

# Generation parameters
generation:
  model_claude: "claude-3-5-sonnet-20241022"
  model_openai: "gpt-4o-2024-08-06"
  model_bedrock: "eu.amazon.nova-micro-v1:0"
  bedrock_region: "eu-west-3"
  model_vllm: "Qwen/Qwen2.5-7B-Instruct"
  vllm_base_url: "http://localhost:8000/v1"
  temperature: 0.9
  max_tokens: 2000
  batch_size: 10
  retry_attempts: 3
  concurrency: 10  # overridden to 150 by generate_bulk.sh for vLLM

# Quality thresholds
quality:
  min_conversation_length: 8
  max_conversation_length: 40
