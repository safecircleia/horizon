[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["data*", "models*", "training*", "inference*", "notebooks*", "evaluation*", "experiments*", "quantization*", "tests*"]

[project]
name = "horizon"
version = "0.1.0"
description = "SafeCircle Risk Detection Model Training System"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-TBD"
authors = [
    {name = "SafeCircle Team", email = "team@safecircle.tech"}
]
keywords = ["ai", "safety", "child-protection", "nlp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
    "datasets>=2.19.0",
    "huggingface_hub>=0.23.0",
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "importlib-metadata>=6.0.0",
    "onnxruntime>=1.19.0,<1.24.3",
    "onnx>=1.21.0",
    "onnxscript>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "jupyter>=1.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "vllm>=0.4.0",
]
tracking = [
    "wandb>=0.16.0",
    "tensorboard>=2.16.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "ipywidgets>=8.1.0",
]

[project.scripts]
horizon-train = "training.scripts.train:main"
horizon-eval = "evaluation.metrics.evaluate:main"
horizon-generate = "data.generation.generators.main:cli"
horizon-serve = "inference.api.serve:main"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    --verbose
    --cov=.
    --cov-report=term-missing
    --cov-report=html
"""

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/experiments/*",
    "*/notebooks/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
