# Horizon Training Configuration - L4 GPU (24GB VRAM)

model:
  base_model: "meta-llama/Llama-3.2-3B-Instruct"
  torch_dtype: "bfloat16"
  max_seq_length: 2048
  attn_implementation: "sdpa"

lora:
  rank: 128
  alpha: 256
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  load_in_4bit: false

training:
  output_dir: "experiments/l4-{timestamp}"
  max_steps: 15000
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "tensorboard"
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4

data:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"
  train_split: 0.9
  max_seq_length: 2048

stages:
  stage1:
    name: "category_recognition"
    steps: 5000
    description: "Category recognition across all 7 risk types"
  stage2:
    name: "severity_calibration"
    steps: 5000
    description: "Severity calibration (none/low/medium/high/critical)"
  stage3:
    name: "false_positive_reduction"
    steps: 5000
    description: "False positive reduction on benign conversations"
