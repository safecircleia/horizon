# Horizon Mobile — Gemma 3 1B fine-tune for LiteRT-LM on-device deployment
# Train:  python -m training.scripts.train --config training/configs/mobile.yaml
# Export: python -m training.scripts.export_litert --checkpoint experiments/mobile-<ts>/final

model:
  base_model: "google/gemma-3-1b-it"
  torch_dtype: "bfloat16"
  max_seq_length: 512
  attn_implementation: "sdpa"

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

training:
  output_dir: "experiments/mobile-{timestamp}"
  max_steps: 8000
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  logging_steps: 25
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "tensorboard"
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4

data:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"
  max_seq_length: 512
